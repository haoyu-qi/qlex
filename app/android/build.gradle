allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Some pinned LocalSend plugins predate Android Gradle Plugin 8 and only
    // declare their package in AndroidManifest.xml. Preserve those upstream
    // versions while deriving the namespace required by current Flutter builds.
    project.plugins.withId('com.android.library') {
        if (project.name == 'shared_storage') {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        if (!project.android.namespace) {
            def manifestFile = project.file('src/main/AndroidManifest.xml')
            if (manifestFile.exists()) {
                def manifestPackage = new XmlSlurper().parse(manifestFile).@package.text()
                if (manifestPackage) {
                    project.android.namespace = manifestPackage
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
