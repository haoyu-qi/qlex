allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // shared_storage 0.8.1 predates Android Gradle Plugin 8 and only declares
    // its package in AndroidManifest.xml. Keep the upstream dependency pinned
    // while supplying the namespace required by current Flutter toolchains.
    if (project.name == 'shared_storage') {
        project.plugins.withId('com.android.library') {
            project.android.namespace = 'io.alexrintt.sharedstorage'
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
