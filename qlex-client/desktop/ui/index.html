<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
  <title>QLEX</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="../vendor/token-monitor/glassRendering.js" defer></script>
  <script src="theme.js" defer></script>
  <script src="ui-moments.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="shell" class="shell" tabindex="-1">
    <!-- Top Draggable Titlebar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="traffic-lights" aria-label="窗口控制">
          <button id="closeButton" class="tl-dot close" type="button" title="关闭窗口"></button>
          <button id="minButton" class="tl-dot min" type="button" title="最小化"></button>
          <button id="pinButton" class="tl-dot pin" type="button" title="窗口置顶"></button>
        </div>
        <div class="brand-cluster">
          <span id="liveDot" class="live-dot" title="节点状态"></span>
          <button id="rolePill" class="role-badge hidden" type="button" title="切换到互联与穿透">本机</button>
        </div>
      </div>

      <div class="topbar-center">
        <div id="topbarStatusPill" class="topbar-status-pill hidden">
          <span id="topbarStatusDot" class="status-pulse"></span>
          <span id="topbarStatusText">中枢总览</span>
        </div>
      </div>

      <div class="topbar-right">
        <button id="syncStatusBtn" class="sync-pill hidden" type="button" title="立即执行全量双向同步">
          <span id="syncRingGlyph" class="sync-ring-glyph" aria-hidden="true"></span>
          <span id="syncStatusText" class="sync-status-text">立即同步</span>
        </button>
        <button id="updatePillBtn" class="version-pill" type="button" title="版本与更新通道">
          <span id="updatePillDot" class="version-dot"></span>
          <span id="updatePillText">v0.4.3</span>
        </button>
      </div>
    </header>

    <!-- Main Body: Left Frosted Pill Capsule Navigation (Logo + Pure Chinese Tabs) + Right Stage -->
    <div id="workspaceFrame" class="workspace-frame">
      <aside id="qlexRail" class="qlex-rail hidden" aria-label="QLEX 主导航">
        <nav class="nav-capsule" data-um-group="main-rail">
          <button class="nav-capsule-logo" type="button" data-rail="overview" title="QLEX · 返回总览">
            <img src="../../docs/assets/brand/logo.svg" alt="QLEX" />
          </button>
          <button class="nav-capsule-btn active" type="button" data-rail="overview" title="中枢总览与同步核心">总览</button>
          <button class="nav-capsule-btn" type="button" data-rail="link" title="中心/接入点与 Tailscale 内网穿透">互联</button>
          <button class="nav-capsule-btn" type="button" data-rail="memory" title="认知记忆引擎、图谱与召回">记忆</button>
          <button class="nav-capsule-btn" type="button" data-rail="workspace" title="跨端项目同步与 6 工具 Skills">
            <span>工程</span>
            <span id="railWorkspaceBadge" class="rail-badge hidden"></span>
          </button>
          <button class="nav-capsule-btn" type="button" data-rail="status" title="节点、采集器、穿透与技能实时状态">状态</button>
        </nav>

        <div class="qlex-rail-aux">
          <button id="insightsNavBtn" class="rail-aux-btn" type="button" data-rail="insights" title="辅助洞察：Agent 用量、订阅额度与历史会话">
            <span class="mask-icon" style="-webkit-mask-image:url('icons/views/trends.svg');mask-image:url('icons/views/trends.svg')"></span>
            <span>洞察</span>
          </button>
          <button id="settingsButton" class="rail-aux-btn" type="button" data-rail="settings" title="外观、毛玻璃、侧边吸附、采集与更新设置">
            <span class="mask-icon" style="-webkit-mask-image:url('icons/actions/settings.svg');mask-image:url('icons/actions/settings.svg')"></span>
            <span>设置</span>
          </button>
        </div>
      </aside>

      <section id="stageHost" class="stage-host">
        <div id="onboardingPanel" class="stage-view onboarding-stage hidden"></div>
        <div id="overviewStage" class="stage-view q-stage hidden"></div>
        <div id="linkStage" class="stage-view split-stage hidden"></div>
        <div id="memoryStage" class="stage-view split-stage hidden"></div>
        <div id="workspaceStage" class="stage-view split-stage hidden"></div>
        <div id="statusStage" class="stage-view status-stage hidden"></div>
        <div id="insightsStage" class="stage-view insights-stage hidden"></div>
        <div id="settingsStage" class="stage-view settings-stage hidden"></div>
      </section>
    </div>

    <div id="notice" class="notice hidden" role="status"></div>
  </main>
</body>
</html>
