<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'" />
  <title>QLEX 快览</title>
  <link rel="stylesheet" href="dock.css" />
  <script src="../vendor/token-monitor/glassRendering.js" defer></script>
  <script src="../vendor/token-monitor/shapes.js" defer></script>
  <script src="theme.js" defer></script>
  <script src="ui-moments.js" defer></script>
  <script src="dock.js" defer></script>
</head>
<body class="edge-dock">
  <svg id="silhouette" class="edge-dock-shape" aria-hidden="true">
    <path id="glass" class="edge-dock-shape-fill"></path>
    <path id="rim" class="edge-dock-shape-line"></path>
  </svg>

  <nav id="rail" aria-label="QLEX 侧边吸附" hidden>
    <button data-item="sync" aria-label="中心点与接入点" title="中心点 / 接入点与双向同步">
      <span class="dock-icon-badge-wrap">
        <svg id="syncRailSvg" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a7.5 7.5 0 0 0-12-1L4 10m0 0V5m0 5h5m-4 6a7.5 7.5 0 0 0 12 1l3-3m0 0v5m0-5h-5"/></svg>
        <i id="syncRailDot" class="dock-status-dot"></i>
      </span>
    </button>
    <button data-item="memory" aria-label="记忆同步" title="记忆同步、知识图谱与 Agent 技能">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5 12 4l8 3.5-8 3.5-8-3.5Zm0 4.5 8 3.5 8-3.5M4 16.5 12 20l8-3.5"/></svg>
    </button>
    <button data-item="projects" aria-label="项目同步" title="项目工作区与跨端共享项目">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4.2l1.8 2H19a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 19 18H5a1.5 1.5 0 0 1-1.5-1.5v-9Z"/></svg>
    </button>
    <button data-item="usage" aria-label="用量统计（辅助）" title="本地工具用量（辅助）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18v-5m7 5V6m7 12V9"/></svg>
    </button>
  </nav>

  <main id="card" hidden>
    <header>
      <h1 id="title"></h1>
      <button id="dismiss" type="button" aria-label="关闭快览">×</button>
    </header>
    <div id="details"></div>
    <footer class="card-footer">
      <button id="quickAction" class="quick-action-btn" type="button" hidden></button>
      <button id="open" type="button">打开工作台 <span aria-hidden="true">↗</span></button>
    </footer>
  </main>
</body>
</html>
